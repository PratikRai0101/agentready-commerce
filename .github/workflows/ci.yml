name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/x402-solana-devnet

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # All values here are disposable CI fixtures. No repository or provider
    # secrets are read by this workflow. Live payment and Devnet gates stay off.
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      X402_MODE: mock
      X402_LIVE_DEVNET_TEST: "0"
      X402_SETTLEMENT_ENABLED: "true"
      X402_TEST_PG: "1"
      TEST_PG_URL: postgresql://ci:ci@127.0.0.1:5432/agentready_ci
      TEST_PG_ENC_KEY: "abababababababababababababababababababababababababababababababab"
      ENVELOPE_SIGNING_SECRET: ci-only-placeholder
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RAZORPAY_WEBHOOK_SECRET: ""
      LLM_API_KEY: ""

    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agentready_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d agentready_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0

      - name: Install frozen dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Run PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/agentready_ci
        run: node packages/payments/migrate.mjs packages/payments/migrations

      - name: Run unit, integration and conformance tests
        run: pnpm -r test

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Production build
        run: pnpm -r build

      - name: Operator CLI guards
        run: |
          node packages/payments/operator-cli.mjs --help
          pnpm --filter @agentready/web exec vitest run test/operator-cli-guard.test.ts

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Safe secrets scan
        shell: bash
        run: |
          if git diff --unified=0 origin/main...HEAD | rg -n -P --no-heading 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY|AKIA[0-9A-Z]{16}|(ghp_|github_pat_|xox[baprs]-|sk_live_|rzp_live_)[A-Za-z0-9_-]{10,}|Bearer\s+[A-Za-z0-9._-]{20,}|postgres(ql)?://(?!ci:ci@)[^\s:]+:[^\s@]+@'; then
            echo "Potential secret detected in the PR diff."
            exit 1
          fi

  smoke:
    name: Browser smoke (mocks only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Disposable mocks-only fixtures. No postgres service, no settlement
    # store, no Devnet/Mainnet transaction, no Razorpay payment and no
    # production credentials. The runner starts `next start` with empty
    # Razorpay keys (mock adapter) and X402_SETTLEMENT_ENABLED=false.
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      X402_MODE: mock
      X402_SETTLEMENT_ENABLED: "false"
      X402_LIVE_DEVNET_TEST: "0"
      ENVELOPE_SIGNING_SECRET: ci-only-placeholder
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      RAZORPAY_WEBHOOK_SECRET: ""
      LLM_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0

      - name: Install frozen dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @agentready/web exec playwright install --with-deps chromium

      - name: Production build
        run: pnpm -r build

      - name: Run browser smoke (storefront + ledger-prototype)
        run: pnpm --filter @agentready/web smoke
